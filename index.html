<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KiCad Netlist Translator — APK.audio</title>
  <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
  <link rel="stylesheet" href="./vendor/apk-table/apk-table.css">
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f1218; color: #e2e8f0; margin: 0; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid #283348; padding-bottom: 15px; margin-bottom: 20px; }
    header h2 { margin: 0; }
    .pill { font-size: 11px; color: var(--apk-accent); border: 1px solid #283348; border-radius: 10px; padding: 2px 8px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    h4 { color: #94a3b8; margin: 0 0 8px; }
    textarea { width: 100%; box-sizing: border-box; height: 420px; background: #181d28; color: #38bdf8; font-family: monospace; font-size: 13px; border: 1px solid #2c364a; border-radius: 6px; padding: 12px; }
    button { background: #0284c7; color: #fff; border: 1px solid #38bdf8; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    button.primary { background: var(--apk-accent); color: var(--apk-on-accent, #111); border-color: var(--apk-accent); }
    .kl { margin-top: 20px; border-top: 1px solid #283348; padding-top: 14px; }
    .kl-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
    .kl-status { font-size: 12px; color: #94a3b8; margin-bottom: 10px; overflow-wrap: anywhere; }
    .kl-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
    @media (max-width: 900px) { .kl-grid { grid-template-columns: 1fr; } }
    .kl-preview { background: #181d28; border: 1px solid #2c364a; border-radius: 6px; min-height: 120px; max-height: 520px; overflow: auto; color: #e2e8f0; padding: 8px; }
    .kl-preview svg { max-width: 100%; height: auto; }
    .kl-actions { margin: 8px 0; }
    .kl-findings { list-style: none; padding: 0; margin: 0; font-size: 12px; max-height: 260px; overflow: auto; }
    .kl-findings li { padding: 3px 0; border-bottom: 1px solid #1f2737; }
    .kl-findings a { color: #38bdf8; font-family: monospace; margin-right: 6px; }
    .kl-error { color: #f87171; } .kl-warning { color: #fbbf24; } .kl-info { color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <h2>⚡ KiCad Netlist Importer &amp; Exporter</h2>
    <span class="pill" id="block-tag">SAMPLE NETLIST</span>
    <div>
      <button id="btn-add">➕ Component</button>
      <button id="btn-open" title="A netlist block (.json) or its .ifc twin">📂 Open</button>
      <button id="btn-dl">Download .net File</button>
      <button id="btn-save-model" title="The block as .json and its .ifc twin (IFC4X3)">💾 Save Model</button>
      <button id="btn-save" class="primary">💾 Save &amp; Return</button>
    </div>
  </header>

  <div class="grid">
    <section>
      <h4>Components</h4>
      <div id="parts-table" class="apk-table-host"></div>
      <h4 style="margin-top: 16px;">Nets</h4>
      <div id="nets-table" class="apk-table-host"></div>
    </section>
    <section>
      <h4>KiCad Eeschema netlist (s-expressions, for PCB layout)</h4>
      <textarea id="output" spellcheck="false" readonly></textarea>
    </section>
  </div>

  <section class="kl">
    <h4>KiCad symbol library (KiCad 10 · KiCad Library Conventions)</h4>
    <div id="library-panel"></div>
  </section>

  <!-- The one softapp client (ROAD-3485): contracts, bus, CAD bridge, table. Classic scripts, before the module. -->
  <script src="./vendor/apk-contracts/apk-contracts.global.js"></script>
  <script src="/FrontEnd/shared/apk-bus.js"></script>
  <script src="./vendor/apk-softapp/apk-softapp.js"></script>
  <script src="./vendor/apk-table/apk-table.js"></script>
  <script type="module" src="./js/kicadApp.js"></script>
</body>
</html>
