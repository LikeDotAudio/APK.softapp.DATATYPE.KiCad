<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KiCad Netlist Translator — APK.audio</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f1218; color: #e2e8f0; margin: 0; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #283348; padding-bottom: 15px; margin-bottom: 20px; }
    textarea { width: 100%; height: 350px; background: #181d28; color: #38bdf8; font-family: monospace; font-size: 13px; border: 1px solid #2c364a; border-radius: 6px; padding: 12px; }
    button { background: #0284c7; color: #fff; border: 1px solid #38bdf8; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h2>⚡ KiCad Netlist Importer & Exporter</h2>
    <button id="btn-dl">Download .net File</button>
  </header>

  <p style="color:#94a3b8; font-size:14px;">Generates native KiCad Eeschema netlist s-expressions for PCB layout integration:</p>
  <textarea id="output" spellcheck="false"></textarea>

  <script type="module">
    import { exportKiCadNetlist } from './js/kicad.js';

    const sampleComps = [
      { ref: 'J1', value: 'XLR-F-3PIN', footprint: 'Connector:Neutrik_NC3FAAH', lib: 'Audio', part: 'XLR3' },
      { ref: 'U1', value: 'THAT1512', footprint: 'Package_SO:SOIC-8', lib: 'Audio', part: 'PREAMP' },
      { ref: 'J2', value: '1/4-TRS', footprint: 'Connector:Switchcraft_112', lib: 'Audio', part: 'TRS' }
    ];
    const sampleNets = [
      { name: 'MIC_HOT', nodes: [{ ref: 'J1', pin: '2' }, { ref: 'U1', pin: '2' }] },
      { name: 'MIC_COLD', nodes: [{ ref: 'J1', pin: '3' }, { ref: 'U1', pin: '3' }] },
      { name: 'GND', nodes: [{ ref: 'J1', pin: '1' }, { ref: 'U1', pin: '4' }, { ref: 'J2', pin: 'S' }] }
    ];

    const netlist = exportKiCadNetlist(sampleComps, sampleNets);
    document.getElementById('output').value = netlist;

    document.getElementById('btn-dl').addEventListener('click', () => {
      const blob = new Blob([document.getElementById('output').value], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'schematic-export.net';
      a.click();
    });
  </script>
</body>
</html>
